services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: coupon_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coupon_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data: